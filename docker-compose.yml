version: "3.8"

services:

  # ── Keycloak — Identity and Access Management ────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fideinexus-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: dev-file
      KC_HOSTNAME: lab.vallegrande.edu.pe
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8180:8080"
    command: start-dev
    restart: unless-stopped
    networks:
      - fideinexus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ms-requests — Microservicio de Solicitudes ───────────────────────────
  ms-requests:
    image: salasnapandubanalexander/duban-ms-requests-service:1.7
    container_name: fideinexus-ms-requests
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://ep-sweet-cherry-ac1jujjy-pooler.sa-east-1.aws.neon.tech/requestsservice?sslmode=require
      SPRING_R2DBC_USERNAME: neondb_owner
      SPRING_R2DBC_PASSWORD: npg_JPQSp1e0TCj0
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/fideinexus
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fideinexus/protocol/openid-connect/certs
    ports:
      - "8087:8087"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fideinexus-network

networks:
  fideinexus-network:
    driver: bridge
