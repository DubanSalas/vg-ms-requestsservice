name: CI — Pruebas y Cobertura

on:
  push:
    branches: [ "feature/hexagonal-architecture", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test:
    name: Pruebas unitarias, parametrizadas y cobertura JaCoCo
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar con historial completo (requerido por SonarCloud)
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Ejecutar pruebas unitarias + parametrizadas y generar reporte JaCoCo
      - name: Ejecutar pruebas y generar reporte JaCoCo
        run: mvn clean test

      # 4. Analizar calidad del código con SonarCloud
      - name: Analizar con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=DubanSalas_vg-ms-requestsservice \
            -Dsonar.organization=dubansalas \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # 5. Publicar reporte JaCoCo como artefacto del pipeline
      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
